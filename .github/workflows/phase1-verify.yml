# Phase-1-Verifikation (F1/F2/F4/F7): drei isolierte Pflicht-Checks + Guards.
#
# Regeln:
# - Trigger NUR pull_request gegen main: jeder Job checkt den EXAKTEN
#   PR-Head-SHA aus (kein Merge-Commit, kein manueller Lauf ohne Ref), damit
#   alle Checks denselben Commit prüfen (Merge-Bedingung). workflow_dispatch
#   ist absichtlich entfernt: ein manueller Lauf dürfte sonst versehentlich
#   als PR-Head-Nachweis gewertet werden.
# - Jeder Job hat eine EIGENE frische PostgreSQL-16-Instanz (isolierte DBs,
#   keine gemeinsame mutable Datenbank zwischen Jobs).
# - Unveränderliche Pins (2026-10-09 aufgelöst): Actions per Commit-SHA,
#   Images per Digest. Tags/Digests entsprechen inhaltlich
#   agent-control-stack/docker-compose.yml (postgres:16-alpine, opa:0.68.0).
# - Runner ubuntu-24.04 + Python 3.12 (Repo verlangt >=3.12; Patch floatet,
#   alle Python-Abhängigkeiten sind in pyproject.toml gepinnt).
# - Keine Secrets nötig: ausschließlich TEST-ONLY-Credentials aus
#   agent-control-stack/migrations/002_roles.sql.
# - Ergebnis = Prozess-Exit-Code, niemals eine gemeldete Testanzahl.
#
# Lokal reproduzieren (alle Checks, gleiche Images per Digest):
#   docker run -d -p 5433:5432 -e POSTGRES_USER=control_stack \
#     -e POSTGRES_PASSWORD=testpw -e POSTGRES_DB=control_stack \
#     postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
#   docker run -d -p 8181:8181 \
#     -v $PWD/agent-control-stack/policies:/policies:ro \
#     openpolicyagent/opa:0.68.0@sha256:dd4cb51598c79825fc7e006a0317777f3a0f8eda3fdcaad997d75337fa7e739d \
#     run --server --addr=0.0.0.0:8181 /policies
#   pip install "psycopg[binary]==3.2.4" -e ./agent-control-stack "pytest==8.3.4"
#   PYTHONPATH=agent-control-stack/src python .github/scripts/check_fresh_install.py
#   PYTHONPATH=agent-control-stack/src python .github/scripts/check_upgrade.py
#   cd agent-control-stack && python -m pytest -q   # Exit-Code entscheidet
name: phase1-verify

on:
  pull_request:
    branches: [main]

concurrency:
  group: phase1-verify-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

env:
  PGHOST: 127.0.0.1
  PGPORT: "5433"
  PGADMIN_USER: control_stack
  PGADMIN_PASSWORD: testpw
  # actions/checkout@v4.2.2 / actions/setup-python@v5.6.0, per Commit-SHA gepinnt.
  PG_IMAGE: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
  OPA_IMAGE: openpolicyagent/opa:0.68.0@sha256:dd4cb51598c79825fc7e006a0317777f3a0f8eda3fdcaad997d75337fa7e739d

jobs:
  fresh-install:
    name: fresh-install (001-009, Defaults geschlossen)
    runs-on: ubuntu-24.04
    services:
      pg:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: control_stack
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: control_stack
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U control_stack"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install "psycopg[binary]==3.2.4"
      - name: fresh-install prüfen (fail-closed)
        run: PYTHONPATH=agent-control-stack/src python .github/scripts/check_fresh_install.py

  upgrade:
    name: upgrade (001-004 rekonstruiert + Seed -> 009)
    runs-on: ubuntu-24.04
    services:
      pg:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: control_stack
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: control_stack
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U control_stack"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install "psycopg[binary]==3.2.4"
      - name: upgrade prüfen (fail-closed)
        run: PYTHONPATH=agent-control-stack/src python .github/scripts/check_upgrade.py

  full-suite:
    name: full-suite (pytest, Exit-Code entscheidet)
    runs-on: ubuntu-24.04
    services:
      pg:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: control_stack
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: control_stack
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U control_stack"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Paket + pinned pytest installieren
        run: |
          set -euo pipefail
          pip install -e ./agent-control-stack
          pip install "pytest==8.3.4"
      - name: OPA 0.68.0 mit Repo-Policies starten
        run: |
          set -euo pipefail
          docker run -d --name opa -p 8181:8181 \
            -v "$GITHUB_WORKSPACE/agent-control-stack/policies:/policies:ro" \
            "$OPA_IMAGE" run --server --addr=0.0.0.0:8181 /policies
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8181/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8181/health
      - name: beide Test-DBs definiert initialisieren
        # DSN-Audit (alle 13 Testdateien): 6 Dateien nutzen fest
        # dbname=control_stack_test (eigene Fixtures migrieren selbst),
        # 4 Dateien (execution/gate/recovery/state) nutzen CONTROL_STACK_TEST_DSN
        # mit Default dbname=control_stack, Unit-Tests brauchen keine DB.
        # Statt uns auf Fixtures zu verlassen, migrieren wir BEIDE DBs explizit
        # (migrate ist idempotent) — definierter Zustand statt Zufall.
        run: |
          set -euo pipefail
          python -c "
          import psycopg
          base = 'user=control_stack password=testpw host=127.0.0.1 port=5433 connect_timeout=10'
          with psycopg.connect(f'dbname=postgres {base}', autocommit=True) as c:
              c.execute('SELECT 1 FROM pg_database WHERE datname=%s', ('control_stack_test',))
              if not c.fetchall():
                  c.execute('CREATE DATABASE control_stack_test')
          "
          PYTHONPATH=agent-control-stack/src python -c "
          from control_stack.mig.runner import migrate
          base = 'user=control_stack password=testpw host=127.0.0.1 port=5433 connect_timeout=10'
          for db in ('control_stack', 'control_stack_test'):
              print(db, migrate(f'dbname={db} {base}'))
          "
      - name: vollständige Suite (Exit-Code = Ergebnis)
        working-directory: agent-control-stack
        env:
          CONTROL_STACK_OPA_URL: http://127.0.0.1:8181
        run: python -m pytest -q

  guards:
    name: guards (eingefrorene Docs + alte Migrationen unverändert)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Audit/ADR/Acceptance und Migrationen 001-004 gegen main prüfen
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git rev-parse --verify origin/main
          BASE="$(git merge-base origin/main HEAD)"
          echo "merge-base: $BASE"
          git diff --quiet "$BASE" HEAD -- docs/ \
            || { echo "FEHLER: docs/ (Audit/ADR/Acceptance) verändert"; exit 1; }
          git diff --quiet "$BASE" HEAD -- \
            agent-control-stack/migrations/001_schema.sql \
            agent-control-stack/migrations/002_roles.sql \
            agent-control-stack/migrations/003_evidence.sql \
            agent-control-stack/migrations/004_seq_least_privilege.sql \
            || { echo "FEHLER: bereits angewendete Migration 001-004 verändert"; exit 1; }
          echo "guards OK: docs/ und 001-004 unverändert"
