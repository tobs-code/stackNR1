[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-control-stack"
version = "0.1.0"
description = "Fail-closed authorization and execution boundary for agent actions (reference prototype)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic==2.10.4",
  "psycopg[binary]==3.2.4",
  "httpx==0.28.1",
  "pyyaml==6.0.2",
]

[dependency-groups]
test = ["pytest==8.3.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
